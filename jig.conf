# Jig configuration file
#
# Each [section] is a named configuration, used as:
#   ./jig.sh <config_name> flash all
#
# Any setting not found in the chosen configuration is taken from [global].
# Lines starting with # or ; are comments. Values may optionally be quoted.

[global]
MUX_CLIENT = C:\Working\AS_DW3000_JIG\Multiplex_client\multiplex_client.py
FIRMWARE   = build/asJIG/proximity_app/final_image_proximity_app.hex

# --- app_setup settings ---
FIRMWARE_APP_SETUP = build/asK4W/proximity_app/final_image_proximity_app.hex
DEVICE             = nrf52833
PROVISION_RETRIES  = 5
PROVISION_TIMEOUT  = 60
PROVISION_KEY_AUTH = e8570800393a587118860f155f1c8e22
PROVISION_KEY_ENC  = 25d2bdedb2a55682e0daf2b9db3bf0cf
PROVISION_UID      = 35B3F081


# NODE_ROLE options:
#    0 = LE_SINK         16 = LL_SINK
#    1 = LE_HEADNODE     17 = LL_HEADNODE
#    2 = LE_SUBNODE      18 = LL_SUBNODE
#    4 = ADVERTISER
#   66 = LE_AUTOROLE     82 = LL_AUTOROLE
NODE_ROLE          = 2

# Example: a configuration that overrides only the firmware.
# MUX_CLIENT is not set here, so it is taken from [global].
#
[jig_tag]
#This is what the app_setup will use as input - (The output from the Wirepas make)
FIRMWARE_APP_SETUP = build/asJIG/proximity_app/final_image_proximity_app.hex
#This is waht we send to the programmer
FIRMWARE = build/asJIG/proximity_app/final_image_proximity_app_with_params.hex
DEVICE             = nrf52840
NODE_ROLE          = 2
PROVISION_TIMEOUT  = 120


[jig_anchor]
#This is what the app_setup will use as input - (The output from the Wirepas make)
FIRMWARE_APP_SETUP = build/asJIG/proximity_app/final_image_proximity_app.hex
#This is waht we send to the programmer
FIRMWARE = build/asJIG/proximity_app/final_image_proximity_app_with_params.hex
DEVICE             = nrf52840
NODE_ROLE          = 66
PROVISION_TIMEOUT  = 120

