# createFirmware configuration file
#
# Every [section] other than [global] is a device to build. The section name
# must match a target_board exactly (a directory under board/), e.g. [asK4W].
#
# For each device, createFirmware.sh runs:
#   make target_board=<section> app_name=<APP_NAME>
#   python3 tools/app_setup.py --hexfile <build>/final_image_<APP_NAME>.hex \
#       --device <mcu><mcu_sub> <provisioning args>
# which produces <build>/final_image_<APP_NAME>_with_params.hex
#
# Any setting not found in a device section is taken from [global].
# Lines starting with # or ; are comments. Values may optionally be quoted.

[global]
APP_NAME           = proximity_app

# Run "make clean" for the board before building (yes/no)
CLEAN              = yes

# Set SKIP_BUILD = yes in a device section to leave it out of a full build
# (it is still built if named on the command line, e.g. ./createFirmware.sh asK4W)
SKIP_BUILD         = no

# Set COMBINED_OTAP = yes in a device section to add that device's app to
# combined_app.otap (placed in the root of the archive). Skipped if no device has it.
COMBINED_OTAP      = no

# Bootloader keys used to sign/encrypt the combined OTAP (global setting)
BOOTLOADER_KEYS_FILE = ./custom_bootloader_keys.ini

# Serial number of the programmer used by "./createFirmware.sh <device> flash"
FLASHING_SERIAL    = 261002294

# DEVICE is normally derived from board/<target_board>/config.mk (MCU + MCU_SUB,
# e.g. nrf52 + 833 -> nrf52833). Set it here or in a device section to override.
# DEVICE           = nrf52833

# --- app_setup provisioning settings ---
PROVISION_METHOD   = 1
PROVISION_RETRIES  = 5
PROVISION_TIMEOUT  = 60
# PROVISION_KEY_AUTH = e8570800393a587118860f155f1c8e22
# PROVISION_KEY_ENC  = 25d2bdedb2a55682e0daf2b9db3bf0cf
# PROVISION_UID      = 35B3F081

# NODE_ROLE options:
#    0 = LE_SINK         16 = LL_SINK
#    1 = LE_HEADNODE     17 = LL_HEADNODE
#    2 = LE_SUBNODE      18 = LL_SUBNODE
#    4 = ADVERTISER
#   66 = LE_AUTOROLE     82 = LL_AUTOROLE
NODE_ROLE          = 2


